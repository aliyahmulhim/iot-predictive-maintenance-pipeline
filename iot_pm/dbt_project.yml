  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  iot_pm:
    +schema: raw

models:
  iot_pm:
    staging:
      +materialized: view 
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
  
